<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content MXH</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../../../hub/assets/tool.css">
<style>
/* Laid out like Product Review's window: the product list with Thao tác beside it, the run row, then the results of the
   chosen product (its images and a post to copy) where Product Review shows its progress. Fits the window. */
body { height: 100vh; overflow: hidden; }
main { height: 100%; display: flex; flex-direction: column; }
.layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto auto minmax(0, 1fr); }
.tools-row { display: flex; gap: 12px; margin-bottom: 10px; }
#rows { height: 224px; padding: 10px 10px 6px; }
/* One row per product, as in Product Review: #, name, status, thumbnail, Xem / sửa, ×. */
.qrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 44px 96px 34px; gap: 8px; align-items: center; height: 60px; padding: 0 8px 0 10px; margin-bottom: 4px; background: #fff; border: 1px solid var(--line); cursor: pointer; }
.qrow:hover { background: var(--hover); }
.qrow[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.qrow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow .thumb { width: 44px; height: 44px; background: var(--control); object-fit: cover; display: block; }
.qrow .btn { height: 34px; padding: 0; }
.ok { color: #006400; } .warn { color: rgb(176, 96, 0); }
.empty-list { height: 100%; display: grid; place-content: center; color: var(--muted); }
/* Đăng lên: the platforms to write for, each with its logo; at least one stays on. */
.platforms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.platforms button { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 4px; font: inherit; font-size: 12.5px; color: var(--ink); background: #fff; border: 1px solid var(--line); cursor: pointer; }
.platforms button:hover { background: var(--hover); }
.platforms button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.platforms button[aria-pressed="false"] svg { filter: grayscale(1); opacity: .5; }
.logo { width: 16px; height: 16px; flex: none; display: block; }
#tones { display: flex; }
#tones button { flex: 1; padding: 0 8px; }
/* One post per chosen platform: a tab each, the post, then its length and what suits that platform. */
.post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.post-head .seg button { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; }
.post-head .btn { margin-left: auto; }
.post-tip { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.post-tip .over { color: #b00020; }
#note { min-height: 72px; max-height: 120px; }
.run { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.run .btn { height: 40px; }
#btnRun { width: 160px; } #btnStop { width: 100px; }
/* Results of the chosen product: its images on the left, the post on the right. */
#resultGroup { grid-column: 1 / -1; display: flex; flex-direction: column; min-height: 0; }
#result { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; min-height: 0; }
#result .side { display: flex; flex-direction: column; min-height: 0; }
#result .side > label { margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; height: 32px; }
#out { flex: 1; min-height: 0; max-height: none; margin: 0; }
.tiles { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; overflow-y: auto; min-height: 0; flex: 1; }
.tile { position: relative; flex: none; width: 112px; height: 112px; background: #fff; border: 1px solid var(--line); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; font-size: 13px; }
.tile.add { display: grid; place-content: center; text-align: center; gap: 4px; border-style: dashed; color: var(--muted); font: inherit; cursor: pointer; }
.tile.add:hover, .tiles.dropping .tile.add { background: var(--hover); border-color: var(--accent); }
.tile.add b { font-size: 26px; font-weight: 300; line-height: 1; }
.tile.waiting { display: grid; place-content: center; text-align: center; border-style: dashed; color: var(--muted); padding: 8px; font-size: 12px; }
/* Each original image gives several bối cảnh: in the dialog a count under each image, in the results one row per
   original (the original, then its bối cảnh). */
.src { display: flex; flex-direction: column; gap: 4px; flex: none; }
.src .count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.src .count input { width: 52px; height: 24px; padding: 0 4px; }
.group-row { display: flex; gap: 10px; align-items: center; width: 100%; }
.group-row .tile.origin { border-color: #000; }
.group-row .arrow { color: var(--muted); }
#results { flex-direction: column; flex-wrap: nowrap; }
#results .tile { width: 84px; height: 84px; font-size: 11px; }
#results .group-row { gap: 8px; }
.empty-note { flex: 1; display: grid; place-content: center; text-align: center; background: #fff; border: 1px dashed var(--line); color: var(--muted); padding: 12px; }
/* Xem / sửa: the product's details and original images, like Product Review's product dialog. */
dialog { width: 640px; max-width: calc(100vw - 40px); padding: 0; border: 1px solid #7a7a7a; background: var(--control); box-shadow: 0 8px 30px rgba(0, 0, 0, .25); }
dialog::backdrop { background: rgba(0, 0, 0, .25); }
dialog .bar { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 4px 0 12px; background: #fff; border-bottom: 1px solid var(--line); }
dialog .bar button { width: 32px; height: 28px; border: 0; background: none; font-size: 16px; }
dialog .body { padding: 14px 16px 16px; }
dialog .pair { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
dialog .pair label { margin-top: 0; }
dialog textarea { min-height: 72px; max-height: 120px; }
dialog .tiles { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; align-items: flex-start; }
dialog .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
dialog .foot .btn { width: 104px; }
</style>
<script src="../../../hub/assets/hub.js" defer></script>
</head>
<body>
<main>
  <header><a class="btn" id="menu" href="/" hidden>← Menu</a><h1>Content MXH</h1></header>

  <div class="layout">
    <section class="group">
      <h2>Sản phẩm &amp; ảnh</h2>
      <div class="tools-row">
        <button class="btn primary" id="btnAdd" type="button" style="width:160px">+ Thêm sản phẩm</button>
        <button class="btn" id="btnClear" type="button" style="width:120px">Xóa tất cả</button>
      </div>
      <div class="listbox" id="rows"></div>
    </section>
    <section class="group actions-col">
      <h2>Thao tác</h2>
      <label>Đăng lên</label>
      <div class="platforms" id="platforms" role="group" aria-label="Đăng lên"></div>
      <label>Giọng văn</label>
      <div class="seg" id="tones" role="group" aria-label="Giọng văn"></div>
      <label for="note">Lời nhắn cho AI</label>
      <textarea id="note" placeholder="Gửi kèm khuôn sẵn: ý muốn thêm hoặc góp ý. Ví dụ: nhấn mạnh gỗ tự nhiên, giọng gần gũi."></textarea>
    </section>
    <section class="group run">
      <button class="btn primary" id="btnRun" type="button">Bắt đầu</button>
      <button class="btn" id="btnStop" type="button" disabled>Dừng</button>
      <span class="muted" id="status"></span>
    </section>
    <section class="group" id="resultGroup">
      <h2 id="resultTitle">Kết quả</h2>
      <div id="result">
        <div class="side"><label>Ảnh tạo thành</label><div class="tiles" id="results"></div></div>
        <div class="side"><div class="post-head"><div class="seg" id="tabs" role="tablist" aria-label="Nền tảng"></div><button class="btn" id="copy" type="button">Copy bài đăng</button></div><pre class="out" id="out"></pre><div class="post-tip"><span id="tip"></span><span id="count"></span></div></div>
      </div>
    </section>
  </div>
</main>

<dialog id="dlg">
  <div class="bar"><span id="dlgTitle">Sản phẩm</span><button type="button" id="dlgX" aria-label="Đóng">✕</button></div>
  <div class="body">
    <div class="pair">
      <div><label for="name">Tên sản phẩm</label><input id="name" placeholder="Bàn trà gỗ óc chó chân vòm"></div>
      <div><label for="brand">Thương hiệu</label><input id="brand" placeholder="GRENHEIM"></div>
    </div>
    <label for="link">Link sản phẩm</label><input id="link" placeholder="https://…">
    <label for="points">Điểm nổi bật (mỗi dòng một ý)</label><textarea id="points" placeholder="Gỗ tự nhiên nguyên tấm&#10;Chân vòm vững chắc"></textarea>
    <label for="tags">Hashtag (cách nhau bởi dấu cách)</label><input id="tags" placeholder="#BanTraGo #GocTra">
    <label>Ảnh gốc (một sản phẩm có thể nhiều ảnh; mỗi ảnh ra nhiều bối cảnh)</label>
    <div class="tiles" id="sources"></div>
    <input id="pick" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <div class="foot"><button class="btn primary" id="dlgSave" type="button">Lưu</button><button class="btn" id="dlgCancel" type="button">Hủy</button></div>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script>
// Opened from the Tools Hub menu (served over http): a button back to it. Opened as a file: no menu to go back to.
document.getElementById("menu").hidden = !location.protocol.startsWith("http");
// Many products at once, as in Product Review, with a post for each platform chosen in Đăng lên. Each has its details and original images; Bắt đầu will make
// several bối cảnh from each original image (Product Review's image logic, adapted) and write a post per product. Not built yet: the post is a fixed
// template per tone (compose), and the AI will get Lời nhắn cho AI with the template.
// The product details are kept in this browser; original images only while the page is open.
const $ = (id) => document.getElementById(id);
const KEY = "fb-content:v2";
const FIELDS = ["name", "brand", "link", "points", "tags"];
const TONES = { story: "Kể chuyện", short: "Ngắn gọn", sale: "Bán hàng" };
// Each platform gets its own post from the same product: its length limit, how links and hashtags work there, and
// the image shape that suits it.
const PLATFORMS = {
  facebook: { name: "Facebook", limit: 63206, tags: 5, tip: "Link bấm được ngay trong bài · ảnh 4:5 hoặc 1:1",
    logo: '<svg class="logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path d="M13.4 24v-8.4h2.8l.4-3.3h-3.2v-2.1c0-.9.3-1.6 1.6-1.6h1.7V5.7a23 23 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3v2.4H7.2v3.3H10V24z" fill="#fff"/></svg>' },
  instagram: { name: "Instagram", limit: 2200, tags: 30, tip: "Link trong caption không bấm được: để ở bio · ảnh 4:5",
    logo: '<svg class="logo" viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".4" stop-color="#FA7E1E"/><stop offset=".65" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#igg)"/><rect x="5" y="5" width="14" height="14" rx="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.3" cy="7.7" r="1" fill="#fff"/></svg>' },
  threads: { name: "Threads", limit: 500, tags: 1, tip: "Tối đa 500 ký tự, một chủ đề (#) · ảnh 4:5",
    logo: '<svg class="logo" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><text x="12" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">@</text></svg>' },
  tiktok: { name: "TikTok", limit: 4000, tags: 5, tip: "Caption ngắn đi kèm video · ảnh/video 9:16",
    logo: '<svg class="logo" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000"/><path d="M13.6 5v9.3a2.6 2.6 0 1 1-2.6-2.6" fill="none" stroke="#25F4EE" stroke-width="2.2" transform="translate(-.6 -.4)"/><path d="M13.6 5v9.3a2.6 2.6 0 1 1-2.6-2.6" fill="none" stroke="#FE2C55" stroke-width="2.2" transform="translate(.6 .4)"/><path d="M13.6 5v9.3a2.6 2.6 0 1 1-2.6-2.6M13.6 5c.3 2 1.6 3.3 3.6 3.5" fill="none" stroke="#fff" stroke-width="2.2"/></svg>' },
};
const OPENING = {
  story: (n) => `Có những món đồ mình chọn vì đẹp, và có những món ở lại lâu vì hợp với nhịp sống trong nhà. ${n} là một món như vậy.`,
  short: (n) => `${n}.`,
  sale: (n) => `Giới thiệu ${n}.`,
};
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
const platforms = [].concat(saved.platforms || []).filter((p) => PLATFORMS[p]);
const state = { tone: TONES[saved.tone] ? saved.tone : "story", note: saved.note || "", rows: (saved.rows || []).map((r) => ({ ...r, sources: [] })), current: saved.current || "",
  platforms: platforms.length ? platforms : ["facebook", "instagram"], tab: saved.tab || "" };
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ tone: state.tone, note: state.note, current: state.current, platforms: state.platforms, tab: state.tab, rows: state.rows.map(({ sources, ...r }) => r) })); } catch {} };
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);

// The template post for one platform (the AI will write it from this and Lời nhắn cho AI). Facebook: the whole post
// with its link. Instagram: the link goes to the bio, hashtags at the end. Threads: short, the points in one line, one
// topic. TikTok: one caption line under the video.
function compose(row, platform = "facebook") {
  const P = PLATFORMS[platform];
  const name = row.name.trim() || "[Tên sản phẩm]";
  const points = row.points.split("\n").map((s) => s.trim()).filter(Boolean);
  const link = row.link.trim(), brand = row.brand.trim();
  const tags = row.tags.split(/\s+/).filter(Boolean).map((t) => (t.startsWith("#") ? t : `#${t}`)).slice(0, P.tags);
  const parts = [OPENING[state.tone](name)];
  if (platform === "threads" || platform === "tiktok") {
    if (points.length) parts.push(points.slice(0, 3).join(" · ") + (platform === "tiktok" ? "." : ""));
    if (platform === "threads" && link) parts.push(link);
    if (platform === "tiktok") parts.push(brand ? `Xem ở ${brand}, link trong bio.` : "Link trong bio.");
  } else {
    if (points.length) parts.push(points.map((p) => (platform === "instagram" ? `✓ ${p}` : `- ${p}`)).join("\n"));
    if (brand) parts.push(`${brand} — ${state.tone === "story" ? "vẻ đẹp tự nhiên, qua đôi tay người thợ." : platform === "instagram" ? "link ở bio." : "xem thêm tại link bên dưới."}`);
    else if (platform === "instagram" && link) parts.push("Link ở bio.");
    if (platform === "facebook" && link) parts.push(link);
  }
  if (tags.length) parts.push(tags.join(" "));
  return parts.join(platform === "tiktok" ? " " : "\n\n");
}
function rowStatus(row) {
  if (!row.sources.length) return { text: "● Chưa có ảnh", cls: "warn" };
  const scenes = row.sources.reduce((n, s) => n + s.scenes, 0);
  return { text: `● ${row.sources.length} ảnh gốc · ${scenes} ảnh`, cls: "ok" };
}

function renderRows() {
  if (!state.rows.some((r) => r.id === state.current)) state.current = state.rows[0]?.id || "";
  $("rows").replaceChildren(...(state.rows.length ? state.rows.map((row, i) => {
    const st = rowStatus(row);
    const card = el("div", { className: "qrow" });
    card.setAttribute("aria-current", row.id === state.current);
    const thumb = row.sources[0] ? el("img", { className: "thumb", src: row.sources[0].url, alt: "" }) : el("div", { className: "thumb" });
    const open = el("button", { type: "button", className: "btn", textContent: "Xem / sửa" });
    const remove = el("button", { type: "button", className: "btn", textContent: "×", title: "Xóa sản phẩm" });
    card.append(el("span", { className: "muted", textContent: `#${i + 1}` }), el("span", { className: "name", textContent: row.name, title: row.link }), el("span", { className: st.cls, textContent: st.text }), thumb, open, remove);
    card.onclick = () => { state.current = row.id; render(); };
    open.onclick = (e) => { e.stopPropagation(); state.current = row.id; render(); edit(row); };
    remove.onclick = (e) => { e.stopPropagation(); row.sources.forEach((s) => URL.revokeObjectURL(s.url)); state.rows.splice(state.rows.indexOf(row), 1); render(); };
    return card;
  }) : [el("div", { className: "empty-list", textContent: "Bấm + Thêm sản phẩm để bắt đầu." })]));
}
function renderPlatforms() {
  $("platforms").replaceChildren(...Object.entries(PLATFORMS).map(([id, p]) => {
    const b = el("button", { type: "button", innerHTML: `${p.logo}<span>${p.name}</span>` });
    const on = state.platforms.includes(id);
    b.setAttribute("aria-pressed", on);
    b.onclick = () => {
      if (on && state.platforms.length === 1) return toast("Chọn ít nhất một nền tảng");
      state.platforms = on ? state.platforms.filter((x) => x !== id) : Object.keys(PLATFORMS).filter((x) => x === id || state.platforms.includes(x));
      if (!on) state.tab = id;
      render();
    };
    return b;
  }));
}
function renderTones() {
  $("tones").replaceChildren(...Object.entries(TONES).map(([id, name]) => {
    const b = el("button", { type: "button", textContent: name });
    b.setAttribute("aria-pressed", id === state.tone);
    b.onclick = () => { state.tone = id; render(); };
    return b;
  }));
}
function renderResult() {
  const i = state.rows.findIndex((r) => r.id === state.current), row = state.rows[i];
  $("resultTitle").textContent = row ? `Kết quả · #${i + 1} ${row.name}` : "Kết quả";
  if (!state.platforms.includes(state.tab)) state.tab = state.platforms[0];
  const P = PLATFORMS[state.tab];
  $("tabs").replaceChildren(...state.platforms.map((id) => {
    const b = el("button", { type: "button", innerHTML: `${PLATFORMS[id].logo}<span>${PLATFORMS[id].name}</span>` });
    b.setAttribute("role", "tab"); b.setAttribute("aria-pressed", id === state.tab); b.setAttribute("aria-selected", id === state.tab);
    b.onclick = () => { state.tab = id; render(); };
    return b;
  }));
  const text = row ? compose(row, state.tab) : "";
  $("out").textContent = text;
  $("tip").textContent = P.tip;
  $("count").textContent = `${[...text].length.toLocaleString("vi-VN")} / ${P.limit.toLocaleString("vi-VN")} ký tự`;
  $("count").classList.toggle("over", [...text].length > P.limit);
  $("copy").disabled = !row;
  $("results").replaceChildren(...(row?.sources.length
    ? row.sources.map((s) => {
      const line = el("div", { className: "group-row" });
      const origin = el("div", { className: "tile origin", title: `Ảnh gốc: ${s.name}` });
      origin.append(el("img", { src: s.url, alt: s.name }));
      line.append(origin, el("span", { className: "arrow", textContent: "→" }), ...Array.from({ length: s.scenes }, (_, k) => el("div", { className: "tile waiting", textContent: `Bối cảnh ${k + 1}` })));
      return line;
    })
    : [el("div", { className: "empty-note", textContent: row ? "Thêm ảnh gốc ở Xem / sửa, rồi bấm Bắt đầu." : "Thêm sản phẩm để xem ảnh và bài đăng ở đây." })]));
}
function render() {
  renderRows(); renderPlatforms(); renderTones(); renderResult();
  $("status").textContent = `Sẵn sàng • ${state.rows.length} sản phẩm`;
  persist();
}

// ----- Xem / sửa -----
let editing = null, draft = [];
function renderSources() {
  const add = el("button", { type: "button", className: "tile add", innerHTML: "<b>+</b>Thêm ảnh<br><span class=small>hoặc kéo thả</span>" });
  add.onclick = () => $("pick").click();
  $("sources").replaceChildren(...draft.map((s, i) => {
    const box = el("div", { className: "src" }), tile = el("div", { className: "tile" });
    const remove = el("button", { type: "button", className: "btn remove", textContent: "×", title: "Bỏ ảnh này" });
    remove.onclick = () => { draft.splice(i, 1); renderSources(); };
    tile.append(el("img", { src: s.url, alt: s.name, title: s.name }), remove);
    const count = el("label", { className: "count" });
    const n = el("input", { type: "number", min: 1, max: 6, value: s.scenes, title: "Số bối cảnh tạo từ ảnh này" });
    n.oninput = () => { s.scenes = Math.min(6, Math.max(1, Number(n.value) || 1)); };
    count.append(n, "bối cảnh");
    box.append(tile, count);
    return box;
  }), add);
}
function addFiles(files) {
  for (const f of files) if (/^image\/(jpeg|png|webp)$/.test(f.type)) draft.push({ name: f.name, url: URL.createObjectURL(f), scenes: 3 });
  renderSources();
}
function edit(row) {
  editing = row;
  $("dlgTitle").textContent = row ? `Sản phẩm #${state.rows.indexOf(row) + 1}` : "Thêm sản phẩm";
  FIELDS.forEach((f) => { $(f).value = row ? row[f] : ""; });
  draft = row ? row.sources.map((s) => ({ ...s })) : [];
  renderSources();
  $("dlg").showModal();
  $("name").focus();
}
function closeDialog() {
  // Images added and then cancelled are released; kept ones stay with their product.
  const kept = new Set(state.rows.flatMap((r) => r.sources.map((s) => s.url)));
  draft.filter((s) => !kept.has(s.url)).forEach((s) => URL.revokeObjectURL(s.url));
  $("dlg").close();
}
$("dlgSave").onclick = () => {
  if (!$("name").value.trim()) { $("name").focus(); return toast("Điền tên sản phẩm"); }
  const row = editing || { id: Date.now().toString(36) };
  FIELDS.forEach((f) => { row[f] = $(f).value; });
  const keep = new Set(draft.map((s) => s.url));
  (row.sources || []).filter((s) => !keep.has(s.url)).forEach((s) => URL.revokeObjectURL(s.url));
  row.sources = draft;
  if (!editing) state.rows.push(row);
  state.current = row.id;
  $("dlg").close();
  render();
  document.querySelector('.qrow[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
};
$("dlgCancel").onclick = $("dlgX").onclick = closeDialog;
$("dlg").addEventListener("cancel", (e) => { e.preventDefault(); closeDialog(); });
$("pick").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
const strip = $("sources");
strip.addEventListener("dragover", (e) => { e.preventDefault(); strip.classList.add("dropping"); });
strip.addEventListener("dragleave", () => strip.classList.remove("dropping"));
strip.addEventListener("drop", (e) => { e.preventDefault(); strip.classList.remove("dropping"); addFiles(e.dataTransfer.files); });

$("btnAdd").onclick = () => edit(null);
$("btnClear").onclick = () => {
  if (!state.rows.length || !confirm("Xóa tất cả sản phẩm?")) return;
  state.rows.forEach((r) => r.sources.forEach((s) => URL.revokeObjectURL(s.url)));
  state.rows = []; render();
};
$("note").value = state.note;
$("note").oninput = (e) => { state.note = e.target.value; persist(); };
$("btnRun").onclick = () => {
  if (!state.rows.length) return toast("Thêm sản phẩm trước");
  const missing = state.rows.findIndex((r) => !r.sources.length);
  if (missing >= 0) return toast(`Sản phẩm #${missing + 1} chưa có ảnh gốc`);
  toast("Tạo ảnh và bài đăng đang được làm, chưa dùng được");
};
$("copy").onclick = async () => { await navigator.clipboard.writeText($("out").textContent); toast(`Đã copy bài đăng ${PLATFORMS[state.tab].name}`); };
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
render();
</script>
</body>
</html>
