<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content FB</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../../../hub/assets/tool.css">
<style>
/* Fits the window, like Grok Video Prompt. Left: the product (name, original images), the images made from them and
   the post. Right: actions, then the extra details the post uses. */
body { height: 100vh; overflow: hidden; }
main { height: 100%; display: flex; flex-direction: column; padding-bottom: 20px; }
.layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 400px; }
.col { display: flex; flex-direction: column; gap: 20px; min-height: 0; min-width: 0; }
.col > .group { flex: none; }
.col > .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.col > .grow.scroll { overflow-y: auto; }
#points { min-height: 72px; max-height: 120px; }
#postGroup pre.out { flex: 1; min-height: 0; max-height: none; }
/* Image strips: square tiles that scroll sideways when there are many. */
.tiles { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
.tile { position: relative; flex: none; width: 112px; height: 112px; background: #fff; border: 1px solid var(--line); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; padding: 0; line-height: 20px; font-size: 13px; }
.tile.add { display: grid; place-content: center; text-align: center; gap: 4px; border-style: dashed; color: var(--muted); cursor: pointer; font: inherit; }
.tile.add:hover, .tiles.dropping .tile.add { background: var(--hover); border-color: var(--accent); }
.tile.add b { font-size: 26px; font-weight: 300; line-height: 1; }
.tile.waiting { display: grid; place-content: center; text-align: center; border-style: dashed; color: var(--muted); padding: 8px; font-size: 12px; }
.empty-note { height: 112px; display: grid; place-content: center; text-align: center; background: #fff; border: 1px dashed var(--line); color: var(--muted); }
</style>
<script src="../../../hub/assets/hub.js" defer></script>
</head>
<body>
<main>
  <header><a class="btn" id="menu" href="/" hidden>← Menu</a><h1>Content FB</h1></header>

  <div class="layout">
    <div class="col">
      <section class="group">
        <h2>Sản phẩm</h2>
        <label for="name">Tên sản phẩm</label><input id="name" placeholder="Bàn trà gỗ óc chó chân vòm">
        <label>Ảnh gốc</label>
        <div class="tiles" id="sources"></div>
        <input id="pick" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
      </section>
      <section class="group">
        <h2>Ảnh tạo thành</h2>
        <div class="tiles" id="results"></div>
      </section>
      <section class="group grow" id="postGroup">
        <h2>Bài đăng</h2>
        <pre class="out" id="out" style="margin:0"></pre>
      </section>
    </div>
    <div class="col">
      <section class="group actions-col">
        <h2>Thao tác</h2>
        <label>Giọng văn</label>
        <div class="list listbox" id="tones" role="group" aria-label="Giọng văn"></div>
        <button class="btn primary" id="make" type="button">Tạo ảnh</button>
        <button class="btn" id="copy" type="button">Copy bài đăng</button>
      </section>
      <section class="group grow scroll">
        <h2>Thông tin thêm</h2>
        <label for="brand">Thương hiệu</label><input id="brand" placeholder="GRENHEIM">
        <label for="link">Link sản phẩm</label><input id="link" placeholder="https://…">
        <label for="points">Điểm nổi bật (mỗi dòng một ý)</label><textarea id="points" placeholder="Gỗ tự nhiên nguyên tấm&#10;Chân vòm vững chắc"></textarea>
        <label for="tags">Hashtag (cách nhau bởi dấu cách)</label><input id="tags" placeholder="#BanTraGo #GocTra">
      </section>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
// Opened from the Tools Hub menu (served over http): a button back to it. Opened as a file: no menu to go back to.
document.getElementById("menu").hidden = !location.protocol.startsWith("http");
// Temporary logic: fills a fixed template per tone. The real generator (brand voice, AI) replaces compose().
const $ = (id) => document.getElementById(id);
const FIELDS = ["name", "brand", "link", "points", "tags"], KEY = "fb-content:draft";
const TONES = { story: "Kể chuyện", short: "Ngắn gọn", sale: "Giới thiệu bán hàng" };
let tone = "story";
const OPENING = {
  story: (n) => `Có những món đồ mình chọn vì đẹp, và có những món ở lại lâu vì hợp với nhịp sống trong nhà. ${n} là một món như vậy.`,
  short: (n) => `${n}.`,
  sale: (n) => `Giới thiệu ${n}.`,
};
function compose(v) {
  const name = v.name.trim() || "[Tên sản phẩm]";
  const points = v.points.split("\n").map((s) => s.trim()).filter(Boolean);
  const parts = [OPENING[v.tone](name)];
  if (points.length) parts.push(points.map((p) => `- ${p}`).join("\n"));
  if (v.brand.trim()) parts.push(`${v.brand.trim()} — ${v.tone === "story" ? "vẻ đẹp tự nhiên, qua đôi tay người thợ." : "xem thêm tại link bên dưới."}`);
  if (v.link.trim()) parts.push(v.link.trim());
  const tags = v.tags.split(/\s+/).filter(Boolean).map((t) => (t.startsWith("#") ? t : `#${t}`));
  if (tags.length) parts.push(tags.join(" "));
  return parts.join("\n\n");
}
function render() {
  const v = { ...Object.fromEntries(FIELDS.map((f) => [f, $(f).value])), tone };
  try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {}
  $("tones").replaceChildren(...Object.entries(TONES).map(([id, name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card"; b.textContent = name; b.setAttribute("aria-pressed", id === tone);
    b.onclick = () => { tone = id; render(); };
    return b;
  }));
  $("out").textContent = compose(v);
}
try { const saved = JSON.parse(localStorage.getItem(KEY)) || {}; FIELDS.forEach((f) => { if (saved[f] != null) $(f).value = saved[f]; }); if (TONES[saved.tone]) tone = saved.tone; } catch {}
FIELDS.forEach((f) => $(f).addEventListener("input", render));
// Original images: picked or dropped, shown here only (not saved yet). Making images from them comes later, from
// Product Review's image logic; for now each original gets a waiting tile in Ảnh tạo thành.
let sources = [];
function renderImages() {
  const add = Object.assign(document.createElement("button"), { type: "button", className: "tile add", innerHTML: "<b>+</b>Thêm ảnh<br><span class=small>hoặc kéo thả</span>" });
  add.onclick = () => $("pick").click();
  $("sources").replaceChildren(...sources.map((src, i) => {
    const tile = Object.assign(document.createElement("div"), { className: "tile" });
    const remove = Object.assign(document.createElement("button"), { type: "button", className: "btn remove", textContent: "×", title: "Bỏ ảnh này" });
    remove.onclick = () => { URL.revokeObjectURL(src.url); sources.splice(i, 1); renderImages(); };
    tile.append(Object.assign(document.createElement("img"), { src: src.url, alt: src.name, title: src.name }), remove);
    return tile;
  }), add);
  $("results").replaceChildren(...(sources.length
    ? sources.map((src) => Object.assign(document.createElement("div"), { className: "tile waiting", textContent: `Ảnh từ ${src.name}` }))
    : [Object.assign(document.createElement("div"), { className: "empty-note", style: "flex:1", textContent: "Thêm ảnh gốc và tên sản phẩm, rồi bấm Tạo ảnh." })]));
}
function addFiles(files) {
  for (const f of files) if (/^image\/(jpeg|png|webp)$/.test(f.type)) sources.push({ name: f.name, url: URL.createObjectURL(f) });
  renderImages();
}
$("pick").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
const strip = $("sources");
strip.addEventListener("dragover", (e) => { e.preventDefault(); strip.classList.add("dropping"); });
strip.addEventListener("dragleave", () => strip.classList.remove("dropping"));
strip.addEventListener("drop", (e) => { e.preventDefault(); strip.classList.remove("dropping"); addFiles(e.dataTransfer.files); });
$("make").onclick = () => {
  if (!$("name").value.trim()) { $("name").focus(); return toast("Điền tên sản phẩm"); }
  if (!sources.length) return toast("Thêm ảnh gốc trước");
  toast("Tạo ảnh đang được làm, chưa dùng được");
};
renderImages();
$("copy").onclick = async () => { await navigator.clipboard.writeText($("out").textContent); toast("Đã copy bài đăng"); };
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
render();
</script>
</body>
</html>
