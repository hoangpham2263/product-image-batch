<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Video Prompt</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="../../../hub/assets/tool.css">
<script src="../../../hub/assets/hub.js" defer></script>
<script src="../data/prompts.js"></script>
<script src="../data/demo-prompts.js"></script>
<style>
/* Fit the window: groups keep their size and long content scrolls inside them. */
body { height: 100vh; overflow: hidden; }
main { height: 100%; display: flex; flex-direction: column; padding-bottom: 20px; }
.layout { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); }
#styles { height: 288px; overflow-y: auto; align-content: start; padding-right: 2px; }
#product { min-height: 90px; max-height: 160px; }
#promptGroup { display: flex; flex-direction: column; min-height: 0; }
#promptGroup pre.out { flex: 1; min-height: 0; max-height: none; }
</style>
</head>
<body>
<main>
  <header><a class="btn" id="menu" href="/" hidden>← Menu</a><h1>Grok Video Prompt</h1></header>

  <div class="layout">
    <section class="group">
      <h2>Style</h2>
      <div class="seg" id="durations" role="group" aria-label="Thời lượng"></div>
      <div class="list" id="styles" style="margin-top:10px"></div>
    </section>
    <section class="group actions-col">
      <h2>Thao tác</h2>
      <label for="product">Tên sản phẩm</label>
      <textarea id="product" placeholder="Bàn trà gỗ óc chó chân vòm" required></textarea>
      <button class="btn primary" id="copy" type="button">Copy prompt</button>
    </section>
    <section class="group wide" id="promptGroup">
      <h2>Prompt</h2>
      <pre class="out" id="out" style="margin:0"></pre>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
// Opened from the Tools Hub menu (served over http): a button back to it. Opened as a file: no menu to go back to.
document.getElementById("menu").hidden = !location.protocol.startsWith("http");
// Prompts come from data/prompts.js (by length: 6, 10, 15 s); they are added there, not in the page.
const $ = (id) => document.getElementById(id);
const LAST = "grok-video-prompt:last";
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const state = Object.assign({ seconds: "10", code: "", product: "" }, store.get(LAST, {}));

function stylesFor(seconds) {
  return PROMPTS.durations[seconds] || [];
}
function render() {
  $("durations").replaceChildren(...Object.keys(PROMPTS.durations).map((s) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = `${s}s (${stylesFor(s).length})`; b.setAttribute("aria-pressed", s === state.seconds);
    b.onclick = () => { state.seconds = s; state.code = ""; render(); };
    return b;
  }));
  const styles = stylesFor(state.seconds);
  if (!styles.some((x) => x.code === state.code)) state.code = styles[0]?.code || "";
  $("styles").replaceChildren(...(styles.length ? styles.map((x) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card"; b.setAttribute("aria-pressed", x.code === state.code);
    b.textContent = x.name;
    b.onclick = () => { state.code = x.code; render(); };
    return b;
  }) : [Object.assign(document.createElement("div"), { className: "note", textContent: `Chưa có prompt ${state.seconds}s.` })]));
  const style = styles.find((x) => x.code === state.code);
  const name = state.product.trim();
  $("out").textContent = style ? (name ? style.prompt.split(PROMPTS.placeholder).join(name) : style.prompt) : "";
  $("copy").disabled = !style;
  store.set(LAST, state);
}
$("product").value = state.product;
$("product").oninput = (e) => { state.product = e.target.value; render(); };
$("copy").onclick = async () => {
  if (!state.product.trim()) { $("product").focus(); return toast("Điền tên sản phẩm"); } await navigator.clipboard.writeText($("out").textContent); toast("Đã copy prompt"); };
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
render();
</script>
</body>
</html>
